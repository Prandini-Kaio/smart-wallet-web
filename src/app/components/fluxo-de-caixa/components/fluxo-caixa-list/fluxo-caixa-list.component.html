<div class="container">
  <app-fluxo-de-caixa-filter (apply)="onApply($event)"></app-fluxo-de-caixa-filter>
  <app-fluxo-caixa-totalizadores [fluxoCaixa]="output"></app-fluxo-caixa-totalizadores>

  <div class="list">

    <mat-tab-group animationDuration="500ms" (selectedTabChange)="onTabChange($event)">
      <mat-tab *ngFor="let mes of meses" [label]="mes">

        <div *ngIf="loading" class="loading-spinner">
          <mat-spinner diameter="40"></mat-spinner>
        </div>

        <div *ngIf="output && !loading" >
          <table mat-table  [dataSource]="output.lancamentos" class="mat-elevation-z17">

            <ng-container matColumnDef="Conta">
              <th mat-header-cell *matHeaderCellDef class="list-header"> Conta </th>
              <td mat-cell *matCellDef="let element"> <span>{{element.conta?.banco}}</span> <br/><span>{{element.conta?.nome}}</span></td>
            </ng-container>

            <ng-container matColumnDef="Descricao">
              <th mat-header-cell *matHeaderCellDef class="list-header"> Descricao </th>
              <td mat-cell *matCellDef="let element" class="col-valor txt-entradas"> {{element.descricao}} </td>
            </ng-container>

            <ng-container matColumnDef="Categoria">
              <th mat-header-cell *matHeaderCellDef class="list-header" > Categoria </th>
              <td mat-cell *matCellDef="let element" class="col-valor txt-saidas"> {{element.categoria}} </td>
            </ng-container>

            <ng-container matColumnDef="Status">
              <th mat-header-cell *matHeaderCellDef class="list-header" > Status </th>
              <td mat-cell *matCellDef="let element" class="col-valor txt-saidas"> {{element.status}} </td>
            </ng-container>

            <ng-container matColumnDef="Data Vencimento">
              <th mat-header-cell *matHeaderCellDef class="list-header" > Data Vencimento </th>
              <td mat-cell *matCellDef="let element" class="col-valor txt-saidas"> {{element.dtVencimento}} </td>
            </ng-container>

            <ng-container matColumnDef="Entradas">
              <th mat-header-cell *matHeaderCellDef class="list-header" > Entradas </th>
              <td mat-cell *matCellDef="let element" class="col-valor txt-saidas"> {{element.entradas | currency: 'BRL'}} </td>
            </ng-container>

            <ng-container matColumnDef="Saidas">
              <th mat-header-cell *matHeaderCellDef class="list-header" > Saidas </th>
              <td mat-cell *matCellDef="let element" class="col-valor txt-saidas"> {{element.saidas | currency: 'BRL'}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>

      </mat-tab>
    </mat-tab-group>


  </div>
</div>
