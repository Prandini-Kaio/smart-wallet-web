<div class="container">
  <app-resumo-financeiro-filter (apply)="onApply($event)"></app-resumo-financeiro-filter>
  <app-resumo-financeiro-totalizador [resumoFinanceiro]="totalizador"></app-resumo-financeiro-totalizador>


  <div class="list">
    <mat-tab-group animationDuration="500ms" (selectedTabChange)="onTabChange($event)">
      <mat-tab *ngFor="let mes of meses" [label]="mes">

        <div *ngIf="resumos" >
          <table mat-table  [dataSource]="resumos" class="mat-elevation-z17">

            <ng-container matColumnDef="Conta">
              <th mat-header-cell *matHeaderCellDef> Conta </th>
              <td mat-cell *matCellDef="let element"> <span>{{element.conta?.banco}}</span> <br/><span>{{element.conta?.nome}}</span></td>
            </ng-container>

            <ng-container matColumnDef="Entradas">
              <th mat-header-cell *matHeaderCellDef> Entradas </th>
              <td mat-cell *matCellDef="let element"> {{element.entradas | currency: 'BRL'}} </td>
            </ng-container>

            <ng-container matColumnDef="Saidas">
              <th mat-header-cell *matHeaderCellDef> Saidas </th>
              <td mat-cell *matCellDef="let element"> {{element.saidas | currency: 'BRL'}} </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>

      </mat-tab>
    </mat-tab-group>
  </div>
</div>
