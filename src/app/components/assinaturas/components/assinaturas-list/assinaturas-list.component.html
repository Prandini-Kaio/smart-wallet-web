<div class="container">

  <div class="list-container">
    <div *ngIf="loading" class="loading-spinner">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  </div>

  <div *ngIf="assinaturas && !loading" >
    <table mat-table  [dataSource]="assinaturas" class="mat-elevation-z17">

      <ng-container matColumnDef="Conta">
        <th mat-header-cell *matHeaderCellDef class="list-header"> Conta </th>
        <td mat-cell *matCellDef="let element" class="col-conta"> <span>{{element.contaDestino?.banco}}</span> <br/><span>{{element.contaDestino?.nome}}</span></td>
      </ng-container>

      <ng-container matColumnDef="Descricao">
        <th mat-header-cell *matHeaderCellDef class="list-header"> Descricao </th>
        <td mat-cell *matCellDef="let element"> {{element.descricao}} </td>
      </ng-container>

      <ng-container matColumnDef="Valor">
        <th mat-header-cell *matHeaderCellDef class="list-header" > Valor </th>
        <td mat-cell *matCellDef="let element" class="col-valor txt-saidas"> {{element.valor | currency: 'BRL'}} </td>
      </ng-container>

      <ng-container matColumnDef="Acoes">
        <th mat-header-cell *matHeaderCellDef class="list-header" > Ações </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button (click)="edit(element)">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button (click)="delete(element)">
            <mat-icon>delete</mat-icon>
          </button>

          <mat-slide-toggle [checked]="element.ativa" (change)="onChangeAtivo(element)" class="form-field"/>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

</div>
