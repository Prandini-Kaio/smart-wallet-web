<div class="container">

  <!-- Filtro de transações -->
  <app-transacao-filter (apply)="applyFilters($event)"></app-transacao-filter>

  <div class="container-list">

    <!-- Loading -->
    <div *ngIf="loading" class="loading-spinner">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <!-- Tabela de Transações -->
    <div *ngIf="!loading">
      <table mat-table multiple [dataSource]="transacoes" class="mat-elevation-z8">

        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef>
            <mat-checkbox (change)="toggleAll($event.checked)"></mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let transacao">
            <mat-checkbox
              (change)="toggleSelection(transacao)"
              [checked]="transacoesSelecionadas.includes(transacao)">
            </mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef> Descrição </th>
          <td mat-cell *matCellDef="let transacao" class="col-info">{{ transacao.descricaoLancamento }} {{ transacao.descricao }} </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Status </th>
          <td mat-cell *matCellDef="let transacao"> {{ transacao.status }} </td>
        </ng-container>

        <ng-container matColumnDef="vencimento">
          <th mat-header-cell *matHeaderCellDef> Vencimento </th>
          <td mat-cell *matCellDef="let transacao"> {{ transacao.dtVencimento }} </td>
        </ng-container>

        <ng-container matColumnDef="valor">
          <th mat-header-cell *matHeaderCellDef> Valor </th>
          <td mat-cell *matCellDef="let transacao"> {{ transacao.valor | currency:'BRL' }} </td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef> Ações </th>
          <td mat-cell *matCellDef="let transacao">
            <button mat-icon-button (click)="editTransacao(transacao)">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- Cabeçalho e Rodapé -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

  </div>

  <div *ngIf="showPayModal" class="modal-wrapper">
    <div class="modal-overlay" (click)="closePayModal()"></div>
    <div class="modal-content">
      <h2>Pagar transação</h2>
      <div class="modal-body">
        <mat-form-field>
          <mat-label>Conta Destino</mat-label>
          <mat-select [(value)]="contaSelecionada">
            <mat-option [value]="contaVazia">Todas</mat-option>
            <mat-option *ngFor="let conta of contas" [value]="conta">
              {{ conta.nome }} - {{ conta.banco }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="modal-footer">
        <button mat-raised-button color="primary" (click)="payTransacoes()">Pagar</button>
        <button mat-raised-button color="success" (click)="closePayModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <button
    mat-fab
    color="primary"
    class="pay-button"
    (click)="openPayModal()"
    [disabled]="transacoesSelecionadas.length === 0">
    <mat-icon>payment</mat-icon>
  </button>


</div>
